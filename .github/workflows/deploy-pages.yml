# Publishes the homepage to GitHub Pages whenever main changes.
# Only the built site (dist/) is published; source files, tests and docs are not.
name: Publish homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a publish that is already running finish; queue the newest one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci --no-audit --no-fund

      # The site lives under /RentWyse/ on github.io, or at / on a custom domain.
      # Taking the path from GitHub keeps asset links right in both cases.
      - name: Build
        run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
