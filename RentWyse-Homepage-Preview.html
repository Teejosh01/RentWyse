nt smarter. One step at a time.`,description:`Renting doesn't have to feel overwhelming. RentWyse helps you plan, save and pay your rent through a simple, connected process.`,bullets:[`01. Set your rent goal — Decide how much you need for rent and set a savings target that works for you.`,`02. Save at your pace — Put money aside gradually and watch your rent savings grow towards your target.`,`03. Choose a payment plan — Explore payment options that work for you and agree on a rent payment schedule with your landlord.`,`04. Pay and stay on track — Make your rent payments, monitor your progress and build your Tenant Score over time.`],ctas:[]},{number:`03`,label:`RENT SAVINGS`,id:`rent-savings`,heading:`Your next rent starts with what you save today.`,description:`Take the pressure off rent season. Set a savings goal, put money aside at your own pace and gradually build towards your next rent payment.`,bullets:[`Set a rent savings target that suits your needs.`,`Save gradually towards your target.`,`Track your savings progress in one place.`,`Put your accumulated savings towards your rent payments.`],ctas:[`Start Saving`]},{number:`04`,label:`FLEXIBLE RENT PAYMENTS`,id:`flexible-rent-payments`,heading:`Rent doesn't have to come all at once.`,description:`Big rent payments can be overwhelming. RentWyse helps you break your rent into instalments through payment plans agreed upon with your landlord.`,bullets:[`Explore flexible rent payment options.`,`Agree on a payment schedule with your landlord.`,`Use your rent savings towards your payments.`,`Keep track of every payment and outstanding balance.`],ctas:[`Explore Flexible Rent`],note:`Payment plans are subject to landlord approval.`},{number:`05`,label:`TENANT SCORE`,id:`tenant-score`,heading:`Build a rental record that speaks for you.`,description:`Your rent payment history matters. RentWyse helps you build a record based on your rental payment behaviour, giving landlords more insight into your reliability as a tenant
